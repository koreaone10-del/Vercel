name: Programmatic SEO Engine

on:
  schedule:
    # يعمل تلقائياً كل يوم أحد منتصف الليل
    - cron: '0 0 * * 0'
  workflow_dispatch: # يتيح التشغيل اليدوي بنقرة واحدة

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Programmatic SEO Generator
        run: python generate_pages.py

      - name: Commit and Push New Pages
        run: |
          git config --global user.name "Omega-SEO-Bot"
          git config --global user.email "bot@omega.ai"
          git add *.html sitemap.xml
          git commit -m "Auto-generate programmatic SEO pages and sitemap update" || exit 0
          git push


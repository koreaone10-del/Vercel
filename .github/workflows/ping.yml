name: Official URL Health Check

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check canonical site endpoints
        run: |
          set -euo pipefail
          for url in \
            https://x-five-kappa-98.vercel.app/ \
            https://x-five-kappa-98.vercel.app/robots.txt \
            https://x-five-kappa-98.vercel.app/sitemap.xml; do
            status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            test "$status" = "200"
            echo "$status $url"
          done

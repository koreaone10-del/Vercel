name: Published SEO Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check official site
        run: |
          set -euo pipefail
          for url in \
            https://x-five-kappa-98.vercel.app/ \
            https://x-five-kappa-98.vercel.app/robots.txt \
            https://x-five-kappa-98.vercel.app/sitemap.xml; do
            status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            test "$status" = "200"
            echo "$status $url"
          done

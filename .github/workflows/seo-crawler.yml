name: Autonomous Search Engine Pinger

on:
  schedule:
    # يعمل تلقائياً كل يوم في منتصف الليل بتوقيت UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bing & Yahoo via IndexNow
        run: |
          curl -s -o /dev/null -w "%{http_code}" "https://www.bing.com/indexnow?url=https://ultra-compressor-three.vercel.app/&key=omega-indexnow"
          curl -s -o /dev/null -w "%{http_code}" "https://www.bing.com/indexnow?url=https://ultra-compressor-three.vercel.app/png-to-webp.html&key=omega-indexnow"
          curl -s -o /dev/null -w "%{http_code}" "https://www.bing.com/indexnow?url=https://ultra-compressor-three.vercel.app/jpg-to-webp.html&key=omega-indexnow"
          echo "IndexNow Pings Sent Successfully!"

      - name: Ping Google Sitemap Crawler
        run: |
          curl -s -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=https://ultra-compressor-three.vercel.app/sitemap.xml"
          echo "Google Ping Complete!"

